<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Movie</title>

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
        }

        video {
            width: 100vw;
            height: 100vh;
            display: block;
            object-fit: contain;
            background: #000;
        }

    </style>

</head>

<body>

    <video
        id="player"
        controls
        playsinline
        preload="auto"
    ></video>

    <script src="app.js"></script>

</body>

</html>
