<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Кинозал</title>
<style>
html, body {
	margin: 0;
	width: 100%;
	height: 100%;
	background: #000;
	overflow: hidden
}
body {
	display: flex
}
#countdown {
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	width: 100vw;
    height: 100vh;
	background: #000;
	color: #fff;
	font-family: serif;
	font-size: clamp(30px, 18vw, 70px);
    cursor: default;
	font-weight: 400;
	line-height: 1;
	text-align: center;
	z-index: 10
}
#countdown.hidden, #player.hidden {
	display: none
}
video {
	width: 100vw;
	height: 100vh;
	display: block;
	object-fit: contain;
	background: #000
}
</style>
</head><body><div id="countdown" class="hidden">00:00:00</div><video id="player" class="hidden" controls playsinline preload="auto"></video><script src="app.js"></script></body></html>
